[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "diffpack"
version = "0.3.0"
description = "DiffPack: torsional diffusion for protein side-chain packing"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "DeepGraphLearning / DiffPack contributors" }
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.3.0",
  "numpy>=1.26.4",
  "pyyaml>=6.0",
  "platformdirs>=4.2.0",
  "easydict>=1.10",
  "jinja2>=3.1",
  "tqdm>=4.66",
  "biopython>=1.77",
]

[project.optional-dependencies]
torchdrug = [
  "torch-scatter>=2.1.2",
  "torch-cluster>=1.6.3",
  "torch-geometric>=2.6.0",
  "rdkit>=2024.3.5",
  "lmdb",
  "fair-esm",
  "transformers>=4.18.0",
  "matplotlib",
  "networkx",
  "ninja",
  "decorator",
]
pyg = [
  "torch-geometric>=2.6.0",
  "torch-scatter>=2.1.2",
  "torch-cluster>=1.6.3",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "build>=1.2.1",
  "twine>=5.1.0",
  "ruff>=0.6.0",
]

[project.scripts]
diffpack-infer = "diffpack.cli.infer:main"
diffpack-check-structure = "diffpack.cli.check_structure:main"
diffpack-prepare-cache = "diffpack.cli.prepare_cache:main"

[project.urls]
Homepage = "https://github.com/DeepGraphLearning/DiffPack"
Repository = "https://github.com/DeepGraphLearning/DiffPack"
Issues = "https://github.com/DeepGraphLearning/DiffPack/issues"

[tool.flit.module]
name = "diffpack"

[tool.flit.sdist]
include = [
  "src/diffpack/config/*.yaml",
  "script/inference.py",
  "test/",
  "benchmarks/",
  ".github/workflows/",
]
