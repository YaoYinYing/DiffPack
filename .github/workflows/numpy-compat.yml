name: NumPy Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "requirements/**"
      - ".github/workflows/numpy-compat.yml"
      - "pyproject.toml"

jobs:
  numpy-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        numpy-lane: ["1.26", "2.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and runtime deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.numpy-lane }}" = "2.x" ]; then
            CONSTRAINTS=requirements/constraints-numpy2.txt
          else
            CONSTRAINTS=requirements/constraints-numpy126.txt
          fi
          pip install -e ".[dev,torchdrug,pyg]" -c "${CONSTRAINTS}"
      - name: Diagnose runtime and dependency readiness
        run: |
          diffpack-infer --diagnose
      - name: Run tests
        run: |
          pytest -q
      - name: Prepare schedule cache
        run: |
          diffpack-prepare-cache --cache_root numpy_compat_cache
      - name: Smoke + checker (native)
        run: |
          diffpack-infer -c src/diffpack/config/inference_confidence.yaml --seed 2023 --output_dir numpy_compat_output_native --pdb_files 1ubq.pdb --device cpu --backend native --cache_root numpy_compat_cache
          diffpack-check-structure --input 1ubq.pdb --output numpy_compat_output_native/1ubq.pdb --metadata numpy_compat_output_native/run_metadata.json --report numpy_compat_output_native/checker.json
      - name: Smoke + checker (torchdrug)
        run: |
          diffpack-infer -c src/diffpack/config/inference_confidence.yaml --seed 2023 --output_dir numpy_compat_output_torchdrug --pdb_files 1ubq.pdb --device cpu --backend torchdrug --cache_root numpy_compat_cache
          diffpack-check-structure --input 1ubq.pdb --output numpy_compat_output_torchdrug/1ubq.pdb --metadata numpy_compat_output_torchdrug/run_metadata.json --report numpy_compat_output_torchdrug/checker.json
      - name: Smoke + checker (pyg)
        run: |
          diffpack-infer -c src/diffpack/config/inference_confidence.yaml --seed 2023 --output_dir numpy_compat_output_pyg --pdb_files 1ubq.pdb --device cpu --backend pyg --cache_root numpy_compat_cache
          diffpack-check-structure --input 1ubq.pdb --output numpy_compat_output_pyg/1ubq.pdb --metadata numpy_compat_output_pyg/run_metadata.json --report numpy_compat_output_pyg/checker.json
