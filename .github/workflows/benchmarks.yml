name: Benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "benchmarks/**"
      - "pyproject.toml"

jobs:
  cpu-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,torchdrug]"
      - name: Run benchmark
        run: |
          python benchmarks/run_benchmark.py --backend torchdrug --device cpu --output_dir benchmark_output
      - name: Validate benchmark checker status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("benchmark_output/benchmark_result.json").read_text())
          assert payload.get("checker_status") == "pass", payload.get("checker_reports")
          print("checker_status=pass")
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-output
          path: benchmark_output/**
