name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit and smoke tests
        run: |
          pytest -q --maxfail=1 --ignore=test/test_dataset_hetero.py

  test-torchdrug-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + torchdrug + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.3.0"
          TORCH_VER=$(python - <<'PY'
import torch
print(torch.__version__.split('+')[0])
PY
          )
          pip install "torch-scatter>=2.1.2" "torch-cluster>=1.6.3" -f "https://data.pyg.org/whl/torch-${TORCH_VER}+cpu.html"
          pip install -e ".[dev,torchdrug]"
      - name: Run torchdrug-dependent dataset test
        run: |
          pytest -q --maxfail=1 test/test_dataset_hetero.py
